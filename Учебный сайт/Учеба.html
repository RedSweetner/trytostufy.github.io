<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Выбери предмет</title>
<style>
:root{--bg1:#fff3df;--bg2:#fcd4a4;--text:#3b1409;--card:rgba(255,251,244,.92);--hl:#ffeed6;--acc:#c2410c;--accb:#9a3412;--alg1:#7c3aed;--alg2:#a855f7;--chem1:#059669;--chem2:#0ea5e9;--shadow:rgba(120,53,15,.35);--glow:none;--gl:rgba(194,65,12,.25);--hf:"Yeseva One","Philosopher",Georgia,serif;--bf:"Manrope","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;--bat:#3b0764;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg1:#0b0512;--bg2:#2b1042;--text:#f6ecff;--card:rgba(28,16,44,.9);--hl:#34204d;--acc:#fb923c;--accb:#fdba74;--alg1:#7c3aed;--alg2:#d946ef;--chem1:#16a34a;--chem2:#65a30d;--shadow:rgba(0,0,0,.7);--glow:0 0 18px rgba(251,146,60,.55);--gl:rgba(251,146,60,.6);--hf:"Yeseva One","Philosopher",Georgia,serif;--bat:#000}}
:root[data-theme=dark]{--bg1:#0b0512;--bg2:#2b1042;--text:#f6ecff;--card:rgba(28,16,44,.9);--hl:#34204d;--acc:#fb923c;--accb:#fdba74;--alg1:#7c3aed;--alg2:#d946ef;--chem1:#16a34a;--chem2:#65a30d;--shadow:rgba(0,0,0,.7);--glow:0 0 18px rgba(251,146,60,.55);--gl:rgba(251,146,60,.6);--hf:"Yeseva One","Philosopher",Georgia,serif;--bat:#000}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{margin:0;height:100%;background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg1));background-size:300% 300%;animation:bg 14s ease infinite;color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;overflow:hidden}
#leaves{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.leaf{position:absolute;top:-60px;width:var(--s);height:var(--s);color:var(--c);opacity:.85;animation:fall var(--d) linear var(--delay) infinite}
.leaf svg{width:100%;height:100%;display:block;animation:sway var(--sw) ease-in-out var(--delay) infinite alternate}
@keyframes fall{to{transform:translateY(calc(100vh + 120px))}}
@keyframes sway{from{transform:translateX(-40px) rotate(-60deg)}to{transform:translateX(40px) rotate(80deg)}}
@keyframes bg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
@keyframes fd{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:none}}
@keyframes fu{from{opacity:0;translate:0 30px}to{opacity:1;translate:0 0}}
@keyframes fl{0%,100%{top:0}50%{top:-5px}}
@keyframes sh{to{left:140%}}
.view{position:absolute;inset:0;z-index:1;display:none;flex-direction:column;align-items:center;padding:14px 16px}
.view.on{display:flex}
#home{justify-content:center;text-align:center}
h1{margin:0 0 44px;font-size:clamp(2rem,7vw,3.4rem);line-height:1.1;font-weight:800;letter-spacing:-.02em;animation:fd .8s ease both}
.top{width:100%;max-width:760px;display:flex;align-items:center;gap:12px;margin-bottom:12px}
.top h2{margin:0;flex:1;font-size:clamp(1.2rem,4.5vw,1.8rem);text-align:center;padding-right:48px;animation:fd .6s ease both}
.back{width:42px;height:42px;flex:none;border:0;border-radius:50%;font-size:1.4rem;color:#fff;background:linear-gradient(135deg,var(--alg1),var(--alg2));cursor:pointer;box-shadow:0 6px 14px -4px var(--shadow);transition:transform .2s}
.back:hover{transform:scale(1.1) translateX(-2px)}
.col{display:flex;flex-direction:column;align-items:center;gap:20px;width:100%}
#list{max-width:520px;flex:1;overflow-y:auto;padding:6px 4px 24px;gap:14px}
.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:14px;width:100%;max-width:380px;padding:18px 28px;border-radius:18px;color:#fff;text-decoration:none;font-size:clamp(1.15rem,4.5vw,1.45rem);font-weight:700;letter-spacing:.02em;box-shadow:0 12px 28px -8px var(--shadow);transition:transform .25s,box-shadow .25s;opacity:0;cursor:pointer;animation:fu .6s ease forwards;animation-delay:calc(var(--i,0)*.07s + .15s);-webkit-tap-highlight-color:transparent}
#home .btn{animation:fu .7s ease forwards,fl 4s ease-in-out infinite;animation-delay:calc(var(--i)*.2s + .3s),calc(var(--i)*.6s + 1s)}
.alg{background:linear-gradient(135deg,var(--alg1),var(--alg2))}
.chem{background:linear-gradient(135deg,var(--chem1),var(--chem2))}
.btn svg{width:1.9em;height:1.9em;flex:none;transition:transform .4s}
.btn::after{content:"";position:absolute;top:0;left:-75%;width:50%;height:100%;background:linear-gradient(120deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg)}
.btn:hover{transform:translateY(-5px) scale(1.04);box-shadow:0 20px 36px -8px var(--shadow)}
.btn:hover::after{animation:sh .8s}
.btn:hover svg{transform:rotate(-12deg) scale(1.15)}
.btn:active{transform:scale(.97)}
.btn.t{justify-content:flex-start;max-width:440px;padding:14px 20px;font-size:clamp(1rem,4vw,1.2rem);text-align:left}
.btn.t b{display:grid;place-items:center;width:34px;height:34px;flex:none;border-radius:50%;background:rgba(255,255,255,.25)}
#vp{flex:1;width:100%;max-width:760px;min-height:0;overflow:hidden}
#tr{display:flex;height:100%;transition:transform .4s ease}
.sl{min-width:100%;height:100%;overflow-y:auto;padding:2px 4px 10px}
.card{background:var(--card);backdrop-filter:blur(6px);border-radius:18px;padding:18px 20px;line-height:1.6;box-shadow:0 8px 24px -10px var(--shadow)}
.card h3{margin:0 0 8px;font-size:1.25rem}
.card p{margin:8px 0}
.ex{background:var(--hl);border-radius:12px;padding:10px 14px;margin:10px 0}
.fig{display:block;width:100%;max-width:340px;margin:10px auto}
table{border-collapse:collapse;width:100%;margin:8px 0}
td{border-bottom:1px solid rgba(128,128,128,.3);padding:6px 4px}
.nav{display:flex;align-items:center;gap:16px;padding:10px 0 4px}
.nav button{width:46px;height:46px;border:0;border-radius:50%;font-size:1.4rem;color:#fff;background:linear-gradient(135deg,var(--alg1),var(--alg2));cursor:pointer;transition:transform .2s}
.nav button:hover{transform:scale(1.12)}
#dots{display:flex;gap:7px}
#dots i{width:9px;height:9px;border-radius:50%;background:rgba(128,128,128,.45);transition:.3s}
#dots i.a{width:24px;border-radius:6px;background:var(--alg1)}
#cv{width:100%;height:min(340px,48vh);border-radius:14px;background:#fff;touch-action:none;cursor:grab;display:block}
.in{width:100%;padding:11px 14px;font-size:1.05rem;border-radius:12px;border:2px solid var(--alg1);background:var(--card);color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button,.sm{border:0;border-radius:20px;padding:6px 12px;background:var(--hl);color:var(--text);cursor:pointer;font-size:.95rem}
#el{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.el{background:var(--hl);border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:10px;line-height:1.2;font-size:.9rem}
.el b{font-size:1.6rem;color:var(--chem1);min-width:2ch}
.hid .nm{visibility:hidden}
@media(min-width:1024px){.btn{max-width:480px;padding:24px 36px;border-radius:22px}h1{margin-bottom:56px}.card{padding:24px 28px;font-size:1.08rem}}
@media(max-width:480px){.btn{padding:16px 20px;border-radius:16px}h1{margin-bottom:32px}.card{padding:14px 15px}}
@media(max-height:480px){h1{margin-bottom:16px}.col{gap:10px}.btn{padding:10px 20px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.btn{opacity:1}#leaves{display:none}}

body{font-family:var(--bf)}
h1,.top h2,.card h3{font-family:var(--hf);font-weight:400;letter-spacing:.03em}
h1{text-shadow:var(--glow);font-size:clamp(2.4rem,9vw,4.2rem)}
.top h2{color:var(--acc);text-shadow:var(--glow)}
.card{font-size:1.04rem;line-height:1.75;border:1px solid rgba(251,146,60,.25)}
.card h3{font-size:clamp(1.4rem,5vw,1.9rem);color:var(--acc);margin:0 0 12px;padding-bottom:8px;position:relative}
.card h3::after{content:"";position:absolute;left:0;bottom:0;width:70px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--acc),transparent)}
.card b{color:var(--accb)}
.ex{border-left:4px solid var(--acc);line-height:1.95}
.warn{border-left-color:#ef4444}.warn::before{content:"⚠️ "}
.tip::before{content:"💡 "}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 4px;line-height:1.3;font-size:.95em}
.fr>span{padding:0 5px}.fr>span:first-child{border-bottom:1.6px solid currentColor}
.rt{white-space:nowrap}.rv{border-top:1.6px solid currentColor;padding:0 2px;margin-left:1px}
td:first-child{font-weight:700}
.leaf span{display:block;font-size:var(--s);line-height:1;animation:sway var(--sw) ease-in-out var(--delay) infinite alternate}
.deco{display:none;position:fixed;pointer-events:none;z-index:0}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .deco{display:block}}
:root[data-theme=dark] .deco{display:block}
.moon{top:5%;right:6%;width:clamp(50px,9vw,90px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe6,#fde68a 60%,#f59e0b);box-shadow:0 0 40px 12px rgba(253,230,138,.35),0 0 120px 40px rgba(253,230,138,.15);animation:glow 5s ease-in-out infinite alternate}
.pump{bottom:8px;left:8px;width:clamp(56px,10vw,100px);filter:drop-shadow(0 0 12px rgba(251,146,60,.7));animation:bob 3s ease-in-out infinite}
.bat{top:12%;left:-80px;width:48px;animation:fly 16s linear infinite,flap .25s ease-in-out infinite alternate}
.bat+.bat{top:28%;width:34px;animation-duration:22s,.2s;animation-delay:-9s,0s}
@keyframes fly{0%{translate:0 0}25%{translate:30vw -25px}50%{translate:60vw 15px}75%{translate:90vw -20px}100%{translate:calc(100vw + 160px) 0}}
@keyframes flap{to{transform:scaleY(.55)}}
@keyframes glow{to{box-shadow:0 0 60px 20px rgba(253,230,138,.5),0 0 150px 50px rgba(253,230,138,.2)}}
@keyframes bob{50%{transform:translateY(-6px) rotate(2deg)}}
#th{position:fixed;z-index:6;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border:0;border-radius:50%;font-size:1.5rem;background:var(--card);box-shadow:0 6px 16px -4px var(--shadow);cursor:pointer;transition:transform .25s}
#th:hover{transform:rotate(20deg) scale(1.1)}

.vl{display:inline-flex;flex-direction:column;align-items:center;line-height:1.1;margin:0 2px;vertical-align:bottom}
.vl i{font-style:normal;font-size:.7em;font-weight:800;color:var(--acc)}
.tabs{display:flex;gap:8px;margin-bottom:10px;width:100%;max-width:760px}
.tabs button{flex:1;border:0;border-radius:14px;padding:11px;font:700 1rem var(--bf);color:var(--text);background:var(--card);cursor:pointer;transition:.2s}
.tabs button.on{background:linear-gradient(135deg,var(--alg1),var(--alg2));color:#fff;box-shadow:0 6px 14px -4px var(--shadow)}
#qb{flex:1;width:100%;max-width:760px;min-height:0;overflow-y:auto;padding:2px 4px 70px}
.qh{font-weight:800;color:var(--acc);margin-bottom:6px}
.bar{height:8px;border-radius:6px;background:rgba(128,128,128,.25);overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#facc15);border-radius:6px;transition:width .4s}
.qq{font-size:1.15rem;font-weight:700;margin:6px 0 14px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:14px;border:2px solid rgba(128,128,128,.35);background:var(--hl);color:var(--text);font:600 1rem var(--bf);cursor:pointer;transition:transform .15s,background .25s,border-color .25s}
.opt:hover:not(.lock){transform:translateX(4px);border-color:var(--acc)}
.opt b{display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:50%;background:var(--acc);color:#fff}
.opt.ok{background:#16a34a;border-color:#16a34a;color:#fff;animation:pop .4s}
.opt.no{background:#dc2626;border-color:#dc2626;color:#fff;animation:shake .4s}
.opt.ok b,.opt.no b{background:rgba(255,255,255,.3)}
.opt.lock{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:14px;font-weight:800;font-size:1.15rem;animation:pop .4s}
.fb.ok{background:rgba(22,163,74,.2);color:#16a34a}
.fb.no{background:rgba(220,38,38,.18);color:#ef4444}
.nx2{display:block;margin:12px 0 0 auto;border:0;border-radius:20px;padding:10px 22px;font:700 1rem var(--bf);color:#fff;background:linear-gradient(135deg,var(--alg1),var(--alg2));cursor:pointer;transition:transform .2s}
.nx2:hover{transform:scale(1.06)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.task{margin-bottom:14px}
.th{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.th span{font-family:var(--hf);font-size:1.35rem;color:var(--acc)}
.th em{font-style:normal;font-size:.85rem;font-weight:700;opacity:.85}
.solb{background:linear-gradient(135deg,var(--acc),#f59e0b)!important;color:#fff!important;font-weight:700;padding:8px 16px!important}
.sol{margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--hl);border-left:4px solid var(--acc)}
.sol[hidden]{display:none}
.sol:not([hidden]){animation:pop .35s}
.ans{margin-top:8px;font-weight:700}
mark{background:linear-gradient(transparent 15%,#facc15 15%);color:#1c1917;padding:0 5px;border-radius:4px;font-weight:800}
.note{opacity:.8;font-size:.88rem;margin:0 0 10px}
.sec{font-family:var(--hf);font-weight:400;color:var(--acc);margin:20px 0 8px;font-size:1.6rem}
.res{text-align:center}
.res .big{font-size:3.2rem;font-weight:800;color:var(--acc)}
.res .nx2{margin:10px auto}

h1{font-size:clamp(2.2rem,8vw,3.8rem);letter-spacing:.01em;background:linear-gradient(90deg,var(--acc),var(--accb));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none;filter:drop-shadow(0 3px 12px var(--gl))}
.top h2{letter-spacing:.01em}
.btn.t b{font-size:1.2rem}
.btn.t{font-weight:700}
.ag{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin:10px 0}
.ag .el b{font-size:1.3rem}
.task.hc{border:1px solid rgba(239,68,68,.55);background:linear-gradient(135deg,var(--card),rgba(239,68,68,.14))}
.hc .th span{color:#ef4444}
.gbox{margin-top:8px}
.frow{display:flex;align-items:center;gap:8px;margin:6px 0}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.7);flex:none;cursor:pointer;box-shadow:0 0 10px rgba(0,0,0,.25);transition:opacity .2s,transform .2s}
.dot:hover{transform:scale(1.15)}
.dot.off{opacity:.25}
.fl{font-family:var(--hf);color:var(--acc);font-size:1.15rem}
.fi{flex:1;min-width:0;width:auto;font-family:var(--bf);font-weight:600}
.fi.bad{border-color:#ef4444;background:rgba(239,68,68,.12)}
.rm{border:0;background:none;color:var(--text);font-size:1.1rem;cursor:pointer;opacity:.55;padding:4px 6px}
.rm:hover{opacity:1;color:#ef4444}
.gbar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.gbar button,.keys button{border:0;border-radius:10px;padding:7px 12px;background:var(--hl);color:var(--text);font:700 .95rem var(--bf);cursor:pointer;transition:transform .15s,background .2s}
.gbar button:hover,.keys button:hover,.chips button:hover{transform:translateY(-2px);background:var(--acc);color:#fff}
.gbar #fadd{background:linear-gradient(135deg,var(--alg1),var(--alg2));color:#fff}
.keys{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.keys button{min-width:36px;padding:6px 9px;font-family:Georgia,serif;font-style:italic}
#cv{height:min(380px,54vh);border:2px solid rgba(251,146,60,.35);box-shadow:0 10px 30px -12px var(--shadow)}
.gro{margin-top:8px;font-weight:700;font-size:.92rem;min-height:1.5em;display:flex;flex-wrap:wrap;gap:4px 14px}
</style>
</head>
<body>
<div id="leaves" aria-hidden="true"></div>
<div class="deco moon"></div>
<svg class="deco bat" viewBox="0 0 50 22"><path fill="var(--bat)" d="M25 10Q18 0 0 4Q8 8 10 16Q16 11 20 16Q25 12 25 18Q25 12 30 16Q34 11 40 16Q42 8 50 4Q32 0 25 10z"/></svg>
<svg class="deco bat" viewBox="0 0 50 22"><path fill="var(--bat)" d="M25 10Q18 0 0 4Q8 8 10 16Q16 11 20 16Q25 12 25 18Q25 12 30 16Q34 11 40 16Q42 8 50 4Q32 0 25 10z"/></svg>
<svg class="deco pump" viewBox="0 0 100 90"><path d="M50 18q4-14 16-14" stroke="#4d7c0f" stroke-width="6" fill="none" stroke-linecap="round"/><ellipse cx="30" cy="54" rx="26" ry="32" fill="#ea580c"/><ellipse cx="70" cy="54" rx="26" ry="32" fill="#ea580c"/><ellipse cx="50" cy="54" rx="22" ry="34" fill="#f97316"/><path d="M33 46l9 13H24zM67 46l9 13H58z" fill="#fde047"/><path d="M30 70q20 16 40 0l-6-4-6 6-8-6-8 6-6-6z" fill="#fde047"/></svg>
<button id="th" aria-label="Сменить тему"></button>

<section id="home" class="view on">
  <h1>Выбери предмет</h1>
  <nav class="col">
    <a class="btn alg" style="--i:0" data-go="alg">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18l16 20M22 18L6 38"/><path d="M28 12c0-3 2-5 5-5s5 2 5 4.5c0 2-1.5 3.5-3.5 5L28 21h10"/></svg>Алгебра</a>
    <a class="btn chem" style="--i:1" data-go="chem">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 5h12M20 5v13L8 38a3.5 3.5 0 0 0 3 5.5h26A3.5 3.5 0 0 0 40 38L28 18V5"/><path d="M13 31h22"/><circle cx="21" cy="37" r="1.8" fill="currentColor" stroke="none"/><circle cx="28" cy="35" r="1.3" fill="currentColor" stroke="none"/></svg>Химия</a>
  </nav>
</section>

<section id="sub" class="view">
  <div class="top"><button class="back" aria-label="Назад">←</button><h2>Выбери тему</h2></div>
  <div id="list" class="col"></div>
</section>

<section id="tm" class="view">
  <div class="top"><button class="back" aria-label="Назад">←</button><h2 id="tmt"></h2></div>
  <div id="tml" class="col" style="margin-top:30px"></div>
</section>

<section id="qz" class="view">
  <div class="top"><button class="back" aria-label="Назад">←</button><h2 id="qzt"></h2></div>
  <div class="tabs"><button data-tab="q" class="on">📝 Тест</button><button data-tab="w">✍️ Задания</button></div>
  <div id="qb"></div>
</section>

<section id="top" class="view">
  <div class="top"><button class="back" aria-label="Назад">←</button><h2 id="tt"></h2></div>
  <div id="vp"><div id="tr"></div></div>
  <div class="nav"><button id="pv" aria-label="Предыдущая">‹</button><div id="dots"></div><button id="nx" aria-label="Следующая">›</button></div>
</section>

<script>
// ---------- Картинки (SVG) ----------
var F='<svg class=fig viewBox="',S=' fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"';

alg:[
['Алгебраические выражения',[
'<h3>🔤 Буквы вместо чисел</h3><p>Алгебра — это арифметика, в которой вместо чисел можно писать буквы. Так мы записываем правила, которые работают сразу для всех чисел.</p><div class=ex>3a + 2b — буквенное выражение<br>5·4 − 7 — числовое выражение</div><p>Буква — это «коробка», в которую можно положить любое число.</p>',
'<h3>🧮 Значение выражения</h3><p>Подставь числа вместо букв и посчитай.</p><div class=ex>a = 2, b = 5<br>3a + 2b = 3·2 + 2·5 = 6 + 10 = <b>16</b></div><div class="ex warn">На нуль делить нельзя! Выражение {5|x − 3} не имеет смысла при x = 3.</div>',
'<h3>📐 Формулы</h3><p>Формула — равенство, в котором одна величина выражена через другие.</p><table><tr><td>s = v·t</td><td>путь = скорость · время</td></tr><tr><td>P = 2(a + b)</td><td>периметр прямоугольника</td></tr><tr><td>S = a·b</td><td>площадь прямоугольника</td></tr><tr><td>v = {s|t}</td><td>скорость</td></tr></table><div class=ex>s = 180 км, t = 3 ч → v = {180|3} = <b>60 км/ч</b></div>',
'<h3>🔁 Порядок действий и упрощение</h3><p>Сначала скобки, потом степень, затем × и ÷, в конце + и −.</p><div class=ex>2 + 3·4² = 2 + 3·16 = <b>50</b></div><p><b>Упростить</b> — значит привести подобные слагаемые: 5a + 3a − 2a = <b>6a</b>.</p><div class="ex tip">Выражения, равные при любых значениях букв, называются <b>тождествами</b>: 2(a + 3) = 2a + 6.</div>']],
['Свойства степеней',[
'<h3>🚀 Что такое степень</h3><p>Степень — короткая запись одинаковых множителей.</p><div class=ex>2⁴ = 2·2·2·2 = 16<br>2 — <b>основание</b>, 4 — <b>показатель</b></div><p>a² читается «а в квадрате», a³ — «а в кубе». Первая степень — само число: a¹ = a.</p>',
'<h3>✖️ Умножение и деление</h3><table><tr><td>aⁿ·aᵐ = aⁿ⁺ᵐ</td><td>x³·x⁵ = x⁸</td></tr><tr><td>{aⁿ|aᵐ} = aⁿ⁻ᵐ</td><td>{x⁷|x²} = x⁵</td></tr></table><div class="ex tip">Основания одинаковые: при умножении показатели <b>складываем</b>, при делении — <b>вычитаем</b>.</div>',
'<h3>🔝 Степень в степени</h3><table><tr><td>(aⁿ)ᵐ = aⁿᵐ</td><td>(x²)³ = x⁶</td></tr><tr><td>(ab)ⁿ = aⁿbⁿ</td><td>(2x)³ = 8x³</td></tr><tr><td>({a|b})ⁿ = {aⁿ|bⁿ}</td><td>({2|3})² = {4|9}</td></tr></table>',
'<h3>0️⃣ Нулевая и отрицательная степень</h3><div class=ex>a⁰ = 1 (при a ≠ 0), например 5⁰ = 1<br>a⁻ⁿ = {1|aⁿ}, например 2⁻³ = {1|2³} = {1|8}</div><div class="ex warn">(−2)² = 4, но −2² = −4. Во втором случае в квадрат возводится только двойка.</div><div class=ex>(2x³)²·x = 4x⁶·x = <b>4x⁷</b></div>']],
['Одночлены и многочлены',[
'<h3>🧱 Одночлен</h3><p>Одночлен — произведение чисел и букв в степенях. В <b>стандартном виде</b> число (коэффициент) стоит первым, а одинаковые буквы собраны вместе.</p><div class=ex>2a·3a²·b = <b>6a³b</b><br>коэффициент 6, степень 3 + 1 = 4</div><div class="ex warn">x + 1 — не одночлен, это сумма.</div>',
'<h3>🧩 Многочлен</h3><p>Многочлен — сумма одночленов, например 3x² − 5x + 1. Слагаемые с одинаковой буквенной частью — <b>подобные</b>, их приводят.</p><div class=ex>4x² + 3x − x² + 5x = <b>3x² + 8x</b></div><p>Степень многочлена — наибольшая степень его одночленов. У 3x² + 8x она равна 2.</p>',
'<h3>➕ Сложение и вычитание</h3><p>Раскрываем скобки. Если перед скобкой минус, все знаки внутри меняются.</p><div class=ex>(3x + 2) − (x − 4) = 3x + 2 − x + 4 = <b>2x + 6</b></div>',
'<h3>✖️ Умножение</h3><p>Одночлен на многочлен: умножаем на каждое слагаемое. Многочлен на многочлен: каждый член на каждый.</p><div class=ex>2x(x² − 3x) = <b>2x³ − 6x²</b><br>(x + 2)(x + 3) = x² + 3x + 2x + 6 = <b>x² + 5x + 6</b></div>',
'<h3>⚡ Формулы сокращённого умножения</h3><div class=ex>(a + b)² = a² + 2ab + b²<br>(a − b)² = a² − 2ab + b²<br>a² − b² = (a − b)(a + b)</div><div class=ex>(x + 5)² = x² + 10x + 25<br>99·101 = 100² − 1 = <b>9999</b></div><div class="ex warn">Не забывай среднее слагаемое: (a + b)² ≠ a² + b².</div>',
'<h3>🔍 Разложение на множители</h3><p>1. <b>Общий множитель:</b> 6x² + 9x = 3x(2x + 3).<br>2. <b>Группировка:</b> ax + ay + bx + by = a(x + y) + b(x + y) = (a + b)(x + y).<br>3. <b>Формулы:</b> 49 − y² = (7 − y)(7 + y).</p><div class="ex tip">Разложение — это умножение наоборот. Проверяй себя, раскрывая скобки.</div>']],
['Системы уравнений',[
'<h3>🧷 Что такое система</h3><p>Система — два уравнения с двумя неизвестными. Решение — пара чисел (x; y), которая подходит к обоим уравнениям.</p><div class=ex>x + y = 5<br>x − y = 1</div><p>Проверим пару (3; 2): 3 + 2 = 5 ✓, 3 − 2 = 1 ✓.</p>',
'<h3>🔄 Способ подстановки</h3><p>Выражаем одну букву и подставляем в другое уравнение.</p><div class=ex>x + y = 5, x − y = 1<br>y = 5 − x<br>x − (5 − x) = 1 → 2x = 6 → x = 3, y = 2</div><div class=ex>Ответ: <b>(3; 2)</b></div>',
'<h3>➕ Способ сложения</h3><p>Складываем уравнения так, чтобы одна буква исчезла. Если не исчезает — умножаем уравнение на число.</p><div class=ex>3x + 2y = 12<br>2x − y = 1 | ·2 → 4x − 2y = 2<br>Сложим: 7x = 14 → x = 2, y = 3</div>',
'<h3>📈 График и задача</h3><p><b>Графически:</b> каждое уравнение — прямая, решение системы — точка пересечения. Параллельные прямые — решений нет, совпадающие — бесконечно много.</p><div class=ex><b>Задача.</b> В кошельке 10 монет по 2 и 5 рублей, всего 38 рублей.<br>x + y = 10, 2x + 5y = 38<br>x = 10 − y → 20 − 2y + 5y = 38 → y = 6, x = 4</div>']],
['Алгебраическая дробь',[
'<h3>🍰 Что это</h3><p>Алгебраическая дробь — дробь, у которой в числителе и знаменателе выражения с буквами.</p><div class=ex>{x + 1|x − 2}</div><p>Знаменатель не может быть нулём, поэтому здесь x ≠ 2.</p>',
'<h3>✂️ Сокращение</h3><p>Основное свойство: числитель и знаменатель можно делить на одно и то же. Сначала раскладываем на множители, потом сокращаем.</p><div class=ex>{x² − 9|x + 3} = {(x − 3)(x + 3)|x + 3} = <b>x − 3</b><br>{6a²b|9ab²} = <b>{2a|3b}</b></div><div class="ex warn">Сокращать можно только множители, а не слагаемые: в {x + 3|3} тройку сократить нельзя.</div>',
'<h3>➕ Сложение и вычитание</h3><div class=ex>{a|x} + {b|x} = {a + b|x}</div><p>Разные знаменатели — приводим к общему.</p><div class=ex>{1|x} + {2|x + 1} = {1·(x + 1) + 2x|x(x + 1)} = <b>{3x + 1|x(x + 1)}</b></div>',
'<h3>✖️ Умножение, деление, степень</h3><div class=ex>{a|b}·{c|d} = {ac|bd}<br>{a|b} : {c|d} = {a|b}·{d|c}<br>({a|b})ⁿ = {aⁿ|bⁿ}</div><div class=ex>{x² − 4|x} : {x + 2|x²} = {(x − 2)(x + 2)|x}·{x²|x + 2} = <b>x(x − 2)</b></div>',
'<h3>🧠 Рациональные выражения</h3><p>План упрощения: 1) разложи на множители, 2) приведи к общему знаменателю, 3) сократи.</p><div class=ex>{x|x − 2} − {4|x² − 2x} = {x|x − 2} − {4|x(x − 2)}<br>= {x² − 4|x(x − 2)} = {(x − 2)(x + 2)|x(x − 2)} = <b>{x + 2|x}</b></div>']],
['Корень',[
'<h3>🌱 Что такое квадратный корень</h3><p>Корень из a — неотрицательное число, квадрат которого равен a.</p><div class=ex>√[49] = 7, так как 7² = 49<br>√[0] = 0<br>√[−4] не существует</div><div class="ex tip">Уравнение x² = 9 имеет два корня: x = 3 и x = −3. А вот √[9] = 3 — только одно число.</div>',
'<h3>🔢 Рациональные и иррациональные числа</h3><p>Числа, которые нельзя записать конечной или периодической дробью, называются <b>иррациональными</b>.</p><div class=ex>√[2] ≈ 1,414…<br>√[3] ≈ 1,732…<br>π ≈ 3,1415…</div><div class=ex>√[a²] = |a|, например √[(−3)²] = 3</div>',
'<h3>⚙️ Свойства корней</h3><div class=ex>√[ab] = √[a]·√[b]<br>√[{a|b}] = {√[a]|√[b]}</div><div class=ex>√[3]·√[12] = √[36] = 6<br>{√[18]|√[2]} = √[9] = 3</div>',
'<h3>📦 Вынесение и внесение множителя</h3><div class=ex>√[72] = √[36·2] = <b>6√[2]</b><br>3√[2] = √[9·2] = <b>√[18]</b></div><p>Сравнить √[5] и 2: внесём двойку, 2 = √[4]. Так как 5 больше 4, то √[5] больше 2.</p>',
'<h3>🎯 Избавление от корня в знаменателе</h3><p>Домножаем числитель и знаменатель на корень.</p><div class=ex>{1|√[2]} = {1·√[2]|√[2]·√[2]} = <b>{√[2]|2}</b><br>{6|√[3]} = {6√[3]|3} = <b>2√[3]</b></div>']],
['Квадратные, кубические и биквадратные уравнения',[
'<h3>🧮 Квадратное уравнение</h3><p>Уравнение вида <b>ax² + bx + c = 0</b>, где a ≠ 0. Если b или c равны нулю, оно <b>неполное</b> и решается проще.</p><div class=ex>x² − 9 = 0 → x² = 9 → x = ±3<br>2x² + 8x = 0 → 2x(x + 4) = 0 → x = 0 или x = −4<br>x² + 4 = 0 → корней нет (квадрат не бывает отрицательным)</div>',
'<h3>🔑 Дискриминант</h3><p><b>D = b² − 4ac</b>. Он показывает, сколько корней у уравнения.</p><div class=ex>D &gt; 0 — два корня: x = {−b ± √[D]|2a}<br>D = 0 — один корень: x = {−b|2a}<br>D &lt; 0 — корней нет</div><div class=ex>x² − 5x + 6 = 0<br>D = 25 − 24 = 1<br>x = {5 ± 1|2} → <b>x = 3 и x = 2</b></div>',
'<h3>✨ Чётный второй коэффициент</h3><p>Если b = 2k, удобнее считать <b>D₁ = k² − ac</b>.</p><div class=ex>x = {−k ± √[D₁]|a}</div><div class=ex>x² − 6x + 5 = 0 → k = −3, D₁ = 9 − 5 = 4<br>x = {3 ± 2|1} → <b>x = 5 и x = 1</b></div>',
'<h3>🧩 Теорема Виета</h3><p>Для приведённого уравнения x² + px + q = 0:</p><div class=ex>x₁ + x₂ = −p<br>x₁·x₂ = q</div><div class=ex>x² − 7x + 12 = 0: сумма 7, произведение 12 → <b>3 и 4</b></div><div class="ex tip">Для ax² + bx + c = 0: x₁ + x₂ = {−b|a}, x₁·x₂ = {c|a}. Теорема работает и наоборот — так удобно подбирать корни.</div>',
'<h3>🔄 Биквадратное уравнение</h3><p>Вид <b>ax⁴ + bx² + c = 0</b>. Замена <b>t = x²</b> превращает его в квадратное.</p><div class=ex>x⁴ − 5x² + 4 = 0<br>t² − 5t + 4 = 0 → t = 1 или t = 4<br>x² = 1 → x = ±1; x² = 4 → x = ±2<br>Ответ: <b>±1, ±2</b></div><div class="ex warn">t = x² не бывает отрицательным: корни t &lt; 0 отбрасываем. В x⁴ + x² − 6 = 0 получаем t = 2 или t = −3. Подходит только t = 2, значит x = ±√[2].</div>',
'<h3>🧊 Кубические уравнения</h3><p>Общие формулы слишком громоздки, поэтому в школе кубические уравнения <b>раскладывают на множители</b>.</p><div class=ex>Вынесение: x³ − 4x = x(x − 2)(x + 2) = 0 → 0, 2, −2<br>Группировка: x³ + x² − 9x − 9 = x²(x + 1) − 9(x + 1) = (x + 1)(x − 3)(x + 3)<br>Подбор: x³ − 6x² + 11x − 6 = 0, корень x = 1 → (x − 1)(x² − 5x + 6) → 1, 2, 3</div><div class="ex tip">Целые корни ищи среди делителей свободного члена.</div>',
'<h3>➗ Дробные уравнения</h3><p>Если неизвестное стоит в знаменателе, сначала находим допустимые значения, затем умножаем на общий знаменатель.</p><div class=ex>{x²|x − 2} = {4|x − 2}, x ≠ 2<br>x² = 4 → x = ±2<br>x = 2 не подходит → <b>x = −2</b></div>',
'<h3>📦 Текстовые задачи</h3><div class=ex>Площадь прямоугольника 48 см², одна сторона на 2 см длиннее другой.<br>x(x + 2) = 48 → x² + 2x − 48 = 0<br>D = 4 + 192 = 196, x = {−2 ± 14|2} → 6 или −8<br>Стороны: <b>6 см и 8 см</b></div><div class="ex tip">Отрицательная длина не подходит. Всегда проверяй смысл ответа.</div>']],
['Неравенства',[
'<h3>⚖️ Числовые неравенства</h3><p>Знаки: &gt; (больше), &lt; (меньше), ≥ и ≤ (не строгие).</p><div class=ex>Прибавили к обеим частям число — знак не меняется.<br>Умножили на положительное — не меняется.<br>Умножили на <b>отрицательное</b> — знак меняется на противоположный.</div><div class=ex>3 &lt; 5 → −3 &gt; −5 (умножили на −1)</div>',
'<h3>🧗 Линейные неравенства</h3><p>Решаем как уравнение, но при делении на отрицательное число меняем знак.</p><div class=ex>3 − 2x &gt; 7<br>−2x &gt; 4 | : (−2), знак меняем<br>x &lt; −2</div><div class=ex>2x + 1 ≤ 9 → 2x ≤ 8 → <b>x ≤ 4</b></div>',
'<h3>📏 Числовые промежутки</h3><table><tr><td>x &gt; 2</td><td>(2; +∞)</td></tr><tr><td>x ≤ 5</td><td>(−∞; 5]</td></tr><tr><td>2 &lt; x ≤ 5</td><td>(2; 5]</td></tr></table><div class="ex tip">Круглая скобка — число не входит, квадратная — входит. Бесконечность всегда в круглой скобке.</div>',
'<h3>🔗 Системы и двойные неравенства</h3><p>Система: решаем каждое неравенство, ответ — пересечение промежутков.</p><div class=ex>x &gt; 1 и x &lt; 4 → <b>(1; 4)</b></div><div class=ex>−1 &lt; 2x + 3 &lt; 7<br>−4 &lt; 2x &lt; 4 → <b>−2 &lt; x &lt; 2</b></div>']],
['Функции и графики',[
'<h3>🎰 Что такое функция</h3><p>Функция — правило, по которому каждому x соответствует ровно один y. Как автомат: бросил x — получил y.</p><div class=ex>y = 2x + 1: при x = 3 получаем y = 7</div><p>x — <b>аргумент</b>, y — <b>значение функции</b>. График — все точки (x; y) на плоскости.</p>',
'<h3>🔣 Язык функций</h3><div class=ex>y = f(x) читается «игрек равно эф от икс»<br>f(x) = 2x + 1 → f(3) = 7<br><b>D(f)</b> — область определения: все допустимые x<br><b>E(f)</b> — множество значений: все получаемые y<br><b>Нуль функции</b> — такое x, что f(x) = 0</div><div class=ex>y = √[x]: D(f) = [0; +∞), E(f) = [0; +∞)<br>y = {1|x}: D(f) = (−∞; 0) ∪ (0; +∞)</div>',
'<h3>📈 Линейная функция y = kx + b</h3><p>График — прямая. <b>k</b> задаёт наклон: k &gt; 0 — прямая растёт, k &lt; 0 — убывает. <b>b</b> — точка пересечения с осью y.</p><div class=ex>y = 2x + 1: точки (0; 1) и (1; 3)<br>Двух точек хватает, чтобы провести прямую.</div>',
'<h3>↗️ Прямая пропорциональность</h3><p>При b = 0 получаем y = kx — прямую через начало координат (0; 0).</p><div class=ex>Прямые параллельны, если у них одинаковое k.<br>y = 2x + 1 и y = 2x − 3 — параллельны.</div><p>Пересечение с осью x: подставь y = 0 и реши уравнение.</p>',
'<h3>🥣 Парабола y = x²</h3><div class=ex>Вершина в (0; 0), ветви вверх<br>x = 2 → y = 4, x = −2 → y = 4<br>График симметричен относительно оси y</div><p>Значения y никогда не отрицательны.</p>',
'<h3>🌗 Гипербола и корень</h3><div class=ex><b>y = {k|x}</b> — гипербола, две ветви, x ≠ 0<br><b>y = √[x]</b> — половина параболы, x ≥ 0</div><p>Проверь сам на следующей странице.</p>',GR]]
],
chem:[
['Химия как предмет',[
'<h3>🧪 О чём эта наука</h3><p>Химия изучает <b>вещества</b>, их свойства и превращения друг в друга. Всё вокруг — вода, воздух, твоя ручка — состоит из веществ.</p>'+IMG.glass+'<div class="ex tip">Тело — предмет (гвоздь), вещество — то, из чего он сделан (железо).</div>',
'<h3>⚛️ Из чего состоят вещества</h3><p>Вещества состоят из мельчайших частиц — <b>атомов</b>. Атомы соединяются в <b>молекулы</b>. В центре атома — ядро, вокруг него движутся электроны.</p>'+IMG.atom+'<div class=ex>Молекула воды H₂O: 2 атома водорода и 1 атом кислорода.</div>',
'<h3>🔎 Свойства веществ</h3><div class=ex><b>Физические:</b> цвет, запах, агрегатное состояние, плотность, температура кипения и плавления.<br><b>Химические:</b> способность превращаться в другие вещества — гореть, ржаветь, разлагаться.</div>',
'<h3>🔥 Физические и химические явления</h3><div class=ex><b>Физические</b> — состав не меняется: плавление льда, испарение воды.<br><b>Химические (реакции)</b> — образуются новые вещества: горение, ржавление, скисание молока.</div><p>Признаки реакции: изменение цвета, запах, осадок, газ, свет, тепло.</p>',
'<h3>🥽 Безопасность в лаборатории</h3><div class="ex warn">Работай в очках и халате. Не пробуй вещества на вкус и не нюхай их близко. Пробирку нагревай, направляя отверстием от себя и от соседей.</div><p>Правило нюхания: ладонью направляй воздух от сосуда к себе.</p>']],
['Типы веществ',[
'<h3>🥤 Чистые вещества и смеси</h3><p><b>Чистое вещество</b> — одно вещество (вода, железо). <b>Смесь</b> — несколько веществ, не потерявших своих свойств.</p>'+IMG.mix+'<div class=ex><b>Однородные</b> — частиц не видно даже в микроскоп: воздух, раствор соли, сплавы.<br><b>Неоднородные</b> — границы видны.</div>',
'<h3>🌫️ Виды смесей</h3><div class=ex>Суспензия: твёрдое в жидкости (вода с мелом)<br>Эмульсия: жидкость в жидкости (молоко, вода с маслом)<br>Аэрозоль: жидкость или твёрдое в газе (туман, дым)<br>Раствор: однородная смесь (морская вода)</div>',
'<h3>🧻 Отстаивание и фильтрование</h3><p>Для смесей с нерастворимыми частицами: тяжёлые частицы оседают сами (<b>отстаивание</b>) или остаются на фильтре (<b>фильтрование</b>).</p>'+IMG.filt,
'<h3>🧲 Магнит и выпаривание</h3><p><b>Магнит</b> вытягивает железные опилки из смеси с песком.</p>'+IMG.mag+'<p><b>Выпаривание:</b> вода превращается в пар, а растворённая соль остаётся.</p>'+IMG.evap,
'<h3>⚗️ Дистилляция</h3><p>Нагреваем смесь жидкостей, пар охлаждаем в холодильнике — получаем чистую жидкость.</p>'+IMG.dist+'<div class=ex>Так получают дистиллированную воду.</div><p><b>Простые</b> вещества состоят из атомов одного элемента (O₂, Fe), <b>сложные</b> — из разных (H₂O, NaCl).</p>']],
['Химические элементы и уравнения',[
'<h3>🔣 Знаки и формулы</h3><p>Химический элемент — вид атомов. У каждого свой знак: H, O, Fe. Знак — одна или две буквы, первая заглавная.</p>'+IMG.h2o+'<div class=ex>Формула <b>H₂O</b>: 2 атома H и 1 атом O. Маленькая цифра внизу — <b>индекс</b>.</div>',
'<h3>🗣️ Как читаются формулы</h3><table><tr><td>H₂O</td><td>«аш-два-о»</td></tr><tr><td>CO₂</td><td>«цэ-о-два»</td></tr><tr><td>NaCl</td><td>«натрий-хлор»</td></tr><tr><td>H₂SO₄</td><td>«аш-два-эс-о-четыре»</td></tr><tr><td>Zn(OH)₂</td><td>«цинк-о-аш-дважды»</td></tr></table>',
'<h3>🧩 Скобки в формулах</h3><p>Индекс за скобкой относится ко всему, что в скобках.</p><div class=ex><b>Zn(OH)₂</b> — гидроксид цинка<br>Zn — 1 атом, O — 2 атома, H — 2 атома</div><div class=ex>Ca(OH)₂: Ca — 1, O — 2, H — 2<br>Al₂(SO₄)₃: Al — 2, S — 3, O — 4·3 = 12</div>',
'<h3>⚖️ Уравнения реакций</h3><div class=ex><b>2H₂ + O₂ = 2H₂O</b></div><p>Читается: «два аш-два плюс о-два равно два аш-два-о». Большая цифра перед формулой — <b>коэффициент</b>.</p><p>Закон сохранения массы: атомов каждого элемента слева и справа поровну. Слева H — 4, O — 2; справа H — 2·2 = 4, O — 2. Верно!</p>',
'<h3>🛠️ Расставляем коэффициенты</h3><p>Считай атомы и выравнивай по очереди.</p><div class=ex>Fe + O₂ → Fe₂O₃<br>Кислорода справа 3, слева 2 → ищем общее 6: 3O₂ и 2Fe₂O₃<br>Железа теперь 4: <b>4Fe + 3O₂ = 2Fe₂O₃</b></div><div class=ex>CH₄ + 2O₂ = CO₂ + 2H₂O<br>ZnCl₂ + 2NaOH = Zn(OH)₂↓ + 2NaCl</div><div class="ex tip">Стрелка вниз ↓ означает осадок, стрелка вверх ↑ — газ.</div>',
'<h3>🔀 Типы реакций</h3><div class=ex><b>Соединение:</b> A + B = AB (2Mg + O₂ = 2MgO)<br><b>Разложение:</b> AB = A + B (2H₂O = 2H₂ + O₂)<br><b>Замещение:</b> Zn + 2HCl = ZnCl₂ + H₂↑<br><b>Обмен:</b> вещества обмениваются частями (ZnCl₂ + 2NaOH = Zn(OH)₂↓ + 2NaCl)</div>',ELH]],
['Валентность',[
'<h3>🔗 Что такое валентность</h3><p>Валентность — число связей, которые атом образует с другими атомами. Её пишут римской цифрой <b>над знаком</b> элемента.</p>'+IMG.ch4+'<div class=ex>⟦I|H⟧–⟦I|Cl⟧: по одной связи у каждого атома<br>⟦I|H⟧–⟦II|O⟧–⟦I|H⟧: у кислорода две связи<br>⟦IV|C⟧⟦I|H⟧₄ (метан): у углерода четыре связи</div>',
